[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saucerswap-v3-replay-harness"
version = "0.1.0"
description = "Offline historical replay harness for the SaucerSwap V3 HBAR/USDC study"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "polars>=1.30.0",
  "duckdb>=1.2.2",
]

[project.scripts]
saucerswap-v3-replay = "saucerswap_v3_replay.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
